name: com_a4ding_livecalc
description: 鐢熻 - Live Calculator App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3+1
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.23
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  intl: ^0.20.2
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  crypto: ^3.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  apple_maps_flutter: ^1.4.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.0
  image_cropper: ^12.2.1
  geolocator: ^14.0.2
  mobile_scanner: ^7.4.0

dependency_overrides:
  # package_info_plus 10.2.0+ 支持 Flutter Built-in Kotlin（10.2.2 修复仅在未启用内置 Kotlin
  # 时才自行应用 KGP），升级后 Android 构建不再出现 KGP 弃用警告。
  # 该包是传递依赖（如 geolocator 等），上游约束可能仍锁 ^9，故用 override 强制升级；
  # 9→10 对 PackageInfo.fromPlatform API 无影响，仅提高 iOS 最低版本至 13（与 Flutter 3.44+ 一致）。
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  drift_dev: ^2.19.0
  mocktail: ^1.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/


